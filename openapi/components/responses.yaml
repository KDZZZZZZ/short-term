BadRequest:
  description: 请求参数或业务前置条件无效。
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/ErrorResponse
      examples:
        validationError:
          value:
            code: VALIDATION_ERROR
            message: 请求参数不合法

Unauthorized:
  description: 未提供有效访问令牌。
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/ErrorResponse
      examples:
        unauthorized:
          value:
            code: UNAUTHORIZED
            message: 请先登录

Forbidden:
  description: 当前用户无权访问或执行该操作。
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/ErrorResponse
      examples:
        forbidden:
          value:
            code: FORBIDDEN
            message: 无权执行该操作

NotFound:
  description: 目标资源不存在或对当前用户不可见。
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/ErrorResponse
      examples:
        notFound:
          value:
            code: RESOURCE_NOT_FOUND
            message: 资源不存在

Conflict:
  description: 唯一约束、商品状态或交易状态发生冲突。
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/ErrorResponse
      examples:
        stateConflict:
          value:
            code: TRADE_STATE_CONFLICT
            message: 当前交易状态不允许执行该操作

PayloadTooLarge:
  description: 上传文件或请求体超过服务限制。
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/ErrorResponse
      examples:
        tooLarge:
          value:
            code: PAYLOAD_TOO_LARGE
            message: 上传内容超过限制

InternalServerError:
  description: 服务端未预期错误。
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/ErrorResponse
      examples:
        internalError:
          value:
            code: INTERNAL_ERROR
            message: 服务暂时不可用

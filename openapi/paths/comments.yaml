collection:
  parameters:
    - $ref: ../components/parameters.yaml#/ProductId
  get:
    tags:
      - Comments
    summary: 查看商品的用户评论
    operationId: listProductComments
    description: |
      返回该商品收到的全部用户评论，固定按 `created_at DESC, id DESC` 排列。
      评论与商品状态无关，`OFF_SHELF`、`RESERVED` 和 `SOLD` 商品的评论同样可见；
      `404` 只表示商品不存在。页码分页不提供跨请求快照，并发评论可能导致
      后续页面漂移。
    parameters:
      - $ref: ../components/parameters.yaml#/Page
      - $ref: ../components/parameters.yaml#/PageSize
    responses:
      '200':
        description: 商品用户评论分页列表。
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/CommentPageSuccess
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '500':
        $ref: ../components/responses.yaml#/InternalServerError
  post:
    tags:
      - Comments
    summary: 发布用户评论
    operationId: createProductComment
    description: |
      任何已认证用户都可以对任何现存商品发布评论：不要求购买过该商品，不限
      商品状态，用户也可以评论自己发布的商品。每个用户对同一商品可以发布
      多条评论。评论发布后不可修改、不可删除。评论发布不改变商品或交易状态。
      商品不存在返回 `404 / RESOURCE_NOT_FOUND`。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/CommentCreateRequest
    responses:
      '201':
        description: 评论已发布。
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/CommentSuccess
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
      '500':
        $ref: ../components/responses.yaml#/InternalServerError

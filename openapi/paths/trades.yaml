productTrade:
  parameters:
    - $ref: ../components/parameters.yaml#/ProductId
  post:
    tags:
      - Trades
    summary: 创建或获取商品购买意向
    operationId: createTrade
    description: |
      当前用户成为买家，商品发布者成为卖家。一个 `(product_id, buyer_id)` 在商品
      整个生命周期内只对应一个 Trade 购买意向，数据库必须以该组合唯一约束并在
      并发请求中执行 create-or-get：首次创建返回 `201`；已经存在时不创建、不改变
      状态，返回该意向当前表示和 `200`，即使旧意向已经 `CANCELLED` 或 `COMPLETED`。
      更换 `Idempotency-Key` 不能创建第二个意向；使用同一 key 重试仍按幂等规则重放
      首次成功的 HTTP 状态与响应体。首次创建时价格快照由服务端读取商品价格，状态为
      `PENDING`，商品保持 `ON_SALE`。用户不能购买自己的商品，该情况返回
      `409 / SELF_ACTION_NOT_ALLOWED`。请求携带 `conversation_id` 时必须验证会话商品
      与买卖双方完全一致；已有 Trade 时，显式提供的值还必须与已存绑定完全相同
      （`null` 也视为显式值）。任一不匹配返回 `409 / CONVERSATION_MISMATCH`，省略该
      字段则只返回既有意向而不修改绑定。
    parameters:
      - $ref: ../components/parameters.yaml#/IdempotencyKey
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/TradeCreateRequest
    responses:
      '200':
        description: 已存在的同一购买意向；未创建新记录，也未改变其当前状态。
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/TradeSuccess
      '201':
        description: 已创建的待处理交易。
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/TradeSuccess
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
      '500':
        $ref: ../components/responses.yaml#/InternalServerError

collection:
  get:
    tags:
      - Trades
    summary: 获取当前用户的交易列表
    operationId: listTrades
    description: |
      `as` 仅表示当前用户在结果中的关系，不是用户固定角色。固定按
      `created_at DESC, id DESC` 排列；页码分页不提供跨请求快照。
    parameters:
      - $ref: ../components/parameters.yaml#/TradeRole
      - $ref: ../components/parameters.yaml#/TradeStatus
      - $ref: ../components/parameters.yaml#/Page
      - $ref: ../components/parameters.yaml#/PageSize
    responses:
      '200':
        description: 当前用户作为买家或卖家的交易分页列表。
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/TradePageSuccess
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '500':
        $ref: ../components/responses.yaml#/InternalServerError

item:
  parameters:
    - $ref: ../components/parameters.yaml#/TradeId
  get:
    tags:
      - Trades
    summary: 获取交易详情
    operationId: getTrade
    description: |
      只有交易买卖双方可以访问。非参与者与不存在的交易均返回
      `404 / RESOURCE_NOT_FOUND`，不通过 `403` 暴露交易是否存在。
    responses:
      '200':
        description: 交易详情。
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/TradeSuccess
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '500':
        $ref: ../components/responses.yaml#/InternalServerError

accept:
  parameters:
    - $ref: ../components/parameters.yaml#/TradeId
  post:
    tags:
      - Trades
    summary: 卖家接受待处理交易
    operationId: acceptTrade
    description: |
      仅卖家可执行 `PENDING -> ACCEPTED`。服务端必须在同一数据库事务中将商品
      `ON_SALE -> RESERVED`，并取消该商品的其他 `PENDING` 交易。
      非参与者与不存在的交易返回 `404 / RESOURCE_NOT_FOUND`；交易买家调用此卖家
      专用动作返回 `403 / FORBIDDEN`。
    parameters:
      - $ref: ../components/parameters.yaml#/IdempotencyKey
    responses:
      '200':
        description: 已接受的交易。
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/TradeSuccess
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
      '500':
        $ref: ../components/responses.yaml#/InternalServerError

reject:
  parameters:
    - $ref: ../components/parameters.yaml#/TradeId
  post:
    tags:
      - Trades
    summary: 卖家拒绝待处理交易
    operationId: rejectTrade
    description: |
      仅卖家可执行 `PENDING -> CANCELLED`，商品状态不变。该 Trade 是该买家对商品
      的唯一购买意向，拒绝后再次调用创建意向接口只返回同一 `CANCELLED` Trade，
      不产生新意向或新通知。非参与者与不存在的交易返回 `404 / RESOURCE_NOT_FOUND`；
      交易买家调用此卖家专用动作返回 `403 / FORBIDDEN`。
    parameters:
      - $ref: ../components/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ReasonRequest
    responses:
      '200':
        description: 已拒绝并取消的交易。
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/TradeSuccess
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
      '500':
        $ref: ../components/responses.yaml#/InternalServerError

cancel:
  parameters:
    - $ref: ../components/parameters.yaml#/TradeId
  post:
    tags:
      - Trades
    summary: 取消交易
    operationId: cancelTrade
    description: |
      `PENDING` 时仅买家可取消且商品不变；`ACCEPTED` 时买卖双方均可取消，
      商品必须从 `RESERVED` 恢复为 `ON_SALE`。`ACCEPTED` 交易取消时，交易和
      商品的状态变化必须原子提交，任一变化失败都不得保留另一项变化。
      非参与者与不存在的交易返回 `404 / RESOURCE_NOT_FOUND`。
    parameters:
      - $ref: ../components/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ReasonRequest
    responses:
      '200':
        description: 已取消的交易。
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/TradeSuccess
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
      '500':
        $ref: ../components/responses.yaml#/InternalServerError

confirm:
  parameters:
    - $ref: ../components/parameters.yaml#/TradeId
  post:
    tags:
      - Trades
    summary: 确认线下交易完成
    operationId: confirmTrade
    description: |
      仅交易买卖双方可确认，接口幂等。第一次确认只记录当前用户确认时间并保持
      `ACCEPTED`；双方均确认后，交易 `ACCEPTED -> COMPLETED`，商品
      `RESERVED -> SOLD`。双方完成确认时，确认时间、交易和商品的状态变化必须
      原子提交，任一变化失败都不得保留其他变化。
      非参与者与不存在的交易返回 `404 / RESOURCE_NOT_FOUND`。
    parameters:
      - $ref: ../components/parameters.yaml#/IdempotencyKey
    responses:
      '200':
        description: 更新确认状态后的交易。
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/TradeSuccess
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
      '500':
        $ref: ../components/responses.yaml#/InternalServerError

me:
  get:
    tags:
      - Users
    summary: 获取当前用户资料
    operationId: getCurrentUser
    responses:
      '200':
        description: 当前用户完整资料。
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/UserMeSuccess
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '500':
        $ref: ../components/responses.yaml#/InternalServerError
  patch:
    tags:
      - Users
    summary: 修改当前用户资料
    operationId: updateCurrentUser
    description: |
      仅修改请求中出现的字段。微信和 QQ 只允许设置或修改为非空值；显式 `null`
      或空字符串返回 `400 / VALIDATION_ERROR`，省略字段表示保持原值。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/UpdateProfileRequest
    responses:
      '200':
        description: 修改后的当前用户资料。
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/UserMeSuccess
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '500':
        $ref: ../components/responses.yaml#/InternalServerError
password:
  put:
    tags:
      - Users
    summary: 修改当前用户密码
    operationId: changeCurrentUserPassword
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ChangePasswordRequest
    responses:
      '200':
        description: 密码修改成功。
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/EmptySuccess
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '500':
        $ref: ../components/responses.yaml#/InternalServerError

products:
  get:
    tags:
      - Users
      - Products
    summary: 获取当前用户发布的商品
    operationId: listCurrentUserProducts
    description: |
      固定按 `created_at DESC, id DESC` 排列。页码分页不提供跨请求快照，并发变更
      可能导致后续页面漂移。每件商品携带 `buyer_review`：该商品收到的买家评价，
      尚无已完成交易的买家发布评价时为 `null`。
    parameters:
      - $ref: ../components/parameters.yaml#/ProductStatus
      - $ref: ../components/parameters.yaml#/Page
      - $ref: ../components/parameters.yaml#/PageSize
    responses:
      '200':
        description: 当前用户发布的商品分页列表。
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/MyProductPageSuccess
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '500':
        $ref: ../components/responses.yaml#/InternalServerError

userProducts:
  get:
    tags:
      - Users
      - Products
    summary: 获取其他用户发布的商品
    operationId: listUserProducts
    description: |
      返回该用户在售（`ON_SALE`）和已售出（`SOLD`）的商品，固定按
      `created_at DESC, id DESC` 排列；`RESERVED` 和 `OFF_SHELF` 只有卖家自己
      可以看到。页码分页不提供跨请求快照。用户不存在返回
      `404 / RESOURCE_NOT_FOUND`。已售出商品的买家评价通过商品详情展示。
    parameters:
      - $ref: ../components/parameters.yaml#/UserId
      - $ref: ../components/parameters.yaml#/Page
      - $ref: ../components/parameters.yaml#/PageSize
    responses:
      '200':
        description: 该用户公开可见的商品分页列表。
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ProductPageSuccess
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '500':
        $ref: ../components/responses.yaml#/InternalServerError

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园易淘 · 我的消息</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f0f4f8 0%, #e6edf4 100%);
            min-height: 100vh;
            padding-bottom: 2rem;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
        }

        :root {
            --brand-blue: #4A90D9;
            --brand-blue-dark: #357ABD;
            --brand-green: #38a169;
            --shadow-sm: 0 2px 8px rgba(74, 144, 217, 0.06);
            --shadow-md: 0 8px 32px rgba(74, 144, 217, 0.08);
            --shadow-lg: 0 20px 60px rgba(74, 144, 217, 0.10), 0 8px 24px rgba(0, 0, 0, 0.04);
        }

        .navbar-custom {
            background: linear-gradient(135deg, var(--brand-blue) 0%, var(--brand-blue-dark) 100%);
            padding: 0.6rem 0;
            box-shadow: 0 2px 12px rgba(74, 144, 217, 0.25);
            border-radius: 0 0 20px 20px;
            margin-bottom: 1.5rem;
        }

        .navbar-custom .navbar-brand {
            color: white !important;
            font-weight: 700;
            font-size: 1.2rem;
        }
        .navbar-custom .navbar-brand i {
            color: white;
        }

        .navbar-custom .nav-user {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .navbar-custom .nav-user .text-muted {
            color: rgba(255, 255, 255, 0.9) !important;
            font-size: 0.9rem;
        }

        .navbar-custom .nav-user .btn {
            color: white;
            border-color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            padding: 0.2rem 0.7rem;
        }

        .navbar-custom .nav-user .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .page-header h3 {
            font-weight: 700;
            color: #1a1a2e;
            font-size: 1.5rem;
            margin: 0;
        }

        .page-header h3 i {
            color: var(--brand-blue);
            margin-right: 0.5rem;
        }

        .page-header .back-btn {
            border-radius: 40px;
            padding: 0.4rem 1.2rem;
            font-size: 0.9rem;
            border: 1.5px solid #dce3ed;
            color: #6c7a94;
            background: transparent;
            transition: all 0.2s;
        }

        .page-header .back-btn:hover {
            background: #f5f8fe;
            border-color: #b8cae0;
            color: #2d3748;
        }

        .conversation-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .conversation-item {
            background: white;
            border-radius: 16px;
            padding: 1rem 1.2rem;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(0, 0, 0, 0.02);
            animation: slideIn 0.4s ease forwards;
            opacity: 0;
            transform: translateX(-10px);
        }

        .conversation-item:nth-child(1) { animation-delay: 0.05s; }
        .conversation-item:nth-child(2) { animation-delay: 0.10s; }
        .conversation-item:nth-child(3) { animation-delay: 0.15s; }
        .conversation-item:nth-child(4) { animation-delay: 0.20s; }
        .conversation-item:nth-child(5) { animation-delay: 0.25s; }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .conversation-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .conversation-item .product-title {
            font-weight: 600;
            color: #1a1a2e;
            font-size: 1rem;
        }

        .conversation-item .partner-name {
            font-weight: 500;
            color: #2d3748;
            font-size: 0.9rem;
        }

        .conversation-item .last-msg {
            color: #8a9bb5;
            font-size: 0.88rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .conversation-item .time {
            font-size: 0.75rem;
            color: #b0c0d4;
            flex-shrink: 0;
        }

        .conversation-item .unread-badge {
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            min-width: 22px;
            height: 22px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 0.4rem;
        }

        .conversation-item .msg-preview {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex: 1;
            min-width: 0;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 24px;
            box-shadow: var(--shadow-sm);
        }

        .empty-state .empty-icon {
            font-size: 4rem;
            color: #dce3ed;
            margin-bottom: 1rem;
        }

        .empty-state h5 {
            color: #2d3748;
            font-weight: 600;
        }

        .empty-state p {
            color: #8a9bb5;
            font-size: 0.95rem;
        }

        .empty-state .btn-primary {
            border-radius: 40px;
            padding: 0.6rem 2rem;
            background: linear-gradient(135deg, var(--brand-blue) 0%, var(--brand-blue-dark) 100%);
            border: none;
            box-shadow: 0 4px 16px rgba(74, 144, 217, 0.25);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .empty-state .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(74, 144, 217, 0.30);
        }

        @media (max-width: 576px) {
            .page-header h3 {
                font-size: 1.2rem;
            }
            .navbar-custom .nav-user .btn {
                font-size: 0.7rem;
                padding: 0.15rem 0.5rem;
            }
            .conversation-item {
                padding: 0.8rem 1rem;
            }
            .conversation-item .last-msg {
                max-width: 120px;
                font-size: 0.8rem;
            }
            .empty-state {
                padding: 2.5rem 1.5rem;
            }
            .empty-state .empty-icon {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="main.html">
                <i class="fas fa-store-alt"></i> 校园易淘
            </a>
            <div class="nav-user">
                <span class="text-muted" id="userNicknameDisplay">👤 昵称</span>
                <button id="logoutNavBtn" class="btn btn-outline-danger btn-sm">登出</button>
            </div>
        </div>
    </nav>

    <div class="container container-main">
        <div class="page-header">
            <h3><i class="fas fa-envelope"></i> 我的消息</h3>
            <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> 返回首页</button>
        </div>

        <div id="conversationList" class="conversation-list"></div>

        <div id="emptyMessage" class="empty-state">
            <div class="empty-icon"><i class="fas fa-inbox"></i></div>
            <h5>还没有任何聊天记录</h5>
            <p>去商品详情页联系卖家，开始你的第一次聊天吧 💬</p>
            <button class="btn btn-primary" id="goHomeBtn"><i class="fas fa-home"></i> 去首页</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            'use strict';

            const SESSION_KEY = 'mock_session';
            const USERS_KEY = 'mock_users';
            const PRODUCTS_KEY = 'mock_products';
            const MESSAGES_KEY = 'mock_messages';

            function getCurrentUser() {
                const sn = localStorage.getItem(SESSION_KEY);
                if (!sn) return null;
                const users = JSON.parse(localStorage.getItem(USERS_KEY) || '{}');
                return users[sn] || null;
            }

            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('userNicknameDisplay').textContent = '👤 ' + user.nickname;

            function getMessages() {
                const data = localStorage.getItem(MESSAGES_KEY);
                return data ? JSON.parse(data) : [];
            }

            function getProducts() {
                const data = localStorage.getItem(PRODUCTS_KEY);
                return data ? JSON.parse(data) : [];
            }

            function getUsers() {
                const data = localStorage.getItem(USERS_KEY);
                return data ? JSON.parse(data) : {};
            }

            const conversationListEl = document.getElementById('conversationList');
            const emptyMessageEl = document.getElementById('emptyMessage');

            function buildConversations() {
                const allMsgs = getMessages();
                const products = getProducts();
                const users = getUsers();

                // 只保留当前用户参与的消息
                const myMsgs = allMsgs.filter(function(m) {
                    return m.senderId === user.studentNumber || m.receiverId === user.studentNumber;
                });

                // 按商品分组
                const groups = {};
                myMsgs.forEach(function(m) {
                    if (!groups[m.productId]) groups[m.productId] = [];
                    groups[m.productId].push(m);
                });

                const conversations = [];
                for (var pid in groups) {
                    var msgs = groups[pid];
                    msgs.sort(function(a, b) { return new Date(a.time) - new Date(b.time); });
                    var last = msgs[msgs.length - 1];
                    var partnerId = last.senderId === user.studentNumber ? last.receiverId : last.senderId;
                    var partner = users[partnerId] || { nickname: '未知用户' };
                    var product = products.find(function(p) { return p.id === parseInt(pid); });
                    if (!product) continue;

                    var unread = msgs.filter(function(m) {
                        return m.senderId === partnerId && m.receiverId === user.studentNumber && !m.read;
                    }).length;

                    conversations.push({
                        productId: parseInt(pid),
                        productTitle: product.title,
                        partnerId: partnerId,
                        partnerNickname: partner.nickname || '未知',
                        lastMsg: last.content,
                        lastTime: last.time,
                        unread: unread
                    });
                }

                conversations.sort(function(a, b) {
                    return new Date(b.lastTime) - new Date(a.lastTime);
                });

                return conversations;
            }

            function renderConversations() {
                const convs = buildConversations();

                conversationListEl.innerHTML = '';

                if (convs.length === 0) {
                    emptyMessageEl.style.display = 'block';
                    return;
                }

                emptyMessageEl.style.display = 'none';

                convs.forEach(function(c, index) {
                    var unreadBadge = '';
                    if (c.unread > 0) {
                        unreadBadge = '<span class="unread-badge">' + c.unread + '</span>';
                    }

                    var item = document.createElement('div');
                    item.className = 'conversation-item';
                    item.style.animationDelay = (index * 0.05) + 's';
                    item.innerHTML = `
                        <div class="d-flex justify-content-between align-items-center gap-2">
                            <div class="msg-preview">
                                <span class="product-title">${c.productTitle}</span>
                                <span class="partner-name">· ${c.partnerNickname}</span>
                                <span class="last-msg">${c.lastMsg}</span>
                            </div>
                            <div class="d-flex align-items-center gap-2 flex-shrink-0">
                                <span class="time">${c.lastTime}</span>
                                ${unreadBadge}
                            </div>
                        </div>
                    `;
                    item.dataset.productId = c.productId;
                    item.dataset.partnerId = c.partnerId;
                    conversationListEl.appendChild(item);
                });

                document.querySelectorAll('.conversation-item').forEach(function(item) {
                    item.addEventListener('click', function() {
                        var pid = this.dataset.productId;
                        var partner = this.dataset.partnerId;
                        window.location.href = 'chat.html?productId=' + pid + '&sellerId=' + partner;
                    });
                });
            }

            document.getElementById('backBtn').addEventListener('click', function() {
                window.location.href = 'main.html';
            });

            document.getElementById('goHomeBtn').addEventListener('click', function() {
                window.location.href = 'main.html';
            });

            document.getElementById('logoutNavBtn').addEventListener('click', function() {
                localStorage.removeItem(SESSION_KEY);
                window.location.href = 'login.html';
            });

            renderConversations();

            // 页面可见时刷新消息列表
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) renderConversations();
            });

        })();
    </script>
</body>
</html>

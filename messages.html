<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园易淘 · 我的消息</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; padding-bottom: 2rem; }
        .navbar { box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .container-main { max-width: 800px; margin: 0 auto; }
        .conversation-item {
            background: white;
            border-radius: 0.8rem;
            padding: 0.8rem 1rem;
            margin-bottom: 0.6rem;
            cursor: pointer;
            border: 1px solid #e9ecef;
            transition: background 0.1s;
        }
        .conversation-item:hover { background: #f8f9fa; }
        .conversation-item .product-title { font-weight: 600; }
        .conversation-item .last-msg { color: #6c757d; font-size: 0.9rem; }
        .conversation-item .time { font-size: 0.8rem; color: #adb5bd; }
        .unread-badge {
            background: #dc3545;
            color: white;
            border-radius: 50%;
            padding: 0.1rem 0.5rem;
            font-size: 0.7rem;
            margin-left: 0.5rem;
        }
        .back-btn { margin-bottom: 1rem; }
        .no-conversations { text-align: center; padding: 3rem 0; color: #6c757d; }
        .nav-user { display: flex; align-items: center; gap: 0.8rem; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fas fa-store-alt"></i> 校园易淘</a>
            <div class="nav-user">
                <span class="text-muted me-2" id="userNicknameDisplay">👤 昵称</span>
                <button id="logoutNavBtn" class="btn btn-outline-danger btn-sm">登出</button>
            </div>
        </div>
    </nav>

    <div class="container container-main">
        <div class="back-btn">
            <button class="btn btn-outline-secondary" id="backBtn"><i class="fas fa-arrow-left"></i> 返回首页</button>
        </div>
        <h4><i class="fas fa-envelope"></i> 我的消息</h4>
        <div id="conversationList"></div>
        <div id="emptyMessage" class="no-conversations hidden">
            <i class="fas fa-inbox fa-3x mb-2"></i>
            <p>还没有任何聊天记录</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            'use strict';
            const SESSION_KEY = 'mock_session';
            const USERS_KEY = 'mock_users';
            const PRODUCTS_KEY = 'mock_products';
            const MESSAGES_KEY = 'mock_messages';

            function getCurrentUser() {
                const sn = localStorage.getItem(SESSION_KEY);
                if (!sn) return null;
                const users = JSON.parse(localStorage.getItem(USERS_KEY) || '{}');
                return users[sn] || null;
            }
            const user = getCurrentUser();
            if (!user) {
                window.location.replace('./login.html');
                return;
            }
            document.getElementById('userNicknameDisplay').textContent = '👤 ' + user.nickname;

            function getMessages() {
                const data = localStorage.getItem(MESSAGES_KEY);
                return data ? JSON.parse(data) : [];
            }
            function getProducts() {
                const data = localStorage.getItem(PRODUCTS_KEY);
                return data ? JSON.parse(data) : [];
            }
            function getUsers() {
                const data = localStorage.getItem(USERS_KEY);
                return data ? JSON.parse(data) : {};
            }

            function buildConversations() {
                const allMsgs = getMessages();
                const products = getProducts();
                const users = getUsers();
                const myMsgs = allMsgs.filter(m => m.senderId === user.studentNumber || m.receiverId === user.studentNumber);
                const groups = {};
                myMsgs.forEach(m => {
                    if (!groups[m.productId]) groups[m.productId] = [];
                    groups[m.productId].push(m);
                });
                const conversations = [];
                for (const pid in groups) {
                    const msgs = groups[pid];
                    msgs.sort((a, b) => new Date(a.time) - new Date(b.time));
                    const last = msgs[msgs.length - 1];
                    const partnerId = last.senderId === user.studentNumber ? last.receiverId : last.senderId;
                    const partner = users[partnerId] || { nickname: '未知用户' };
                    const product = products.find(p => p.id === parseInt(pid));
                    if (!product) continue;
                    const unread = msgs.filter(m => m.senderId === partnerId && m.receiverId === user.studentNumber && !m.read).length;
                    conversations.push({
                        productId: parseInt(pid),
                        productTitle: product.title,
                        partnerId: partnerId,
                        partnerNickname: partner.nickname || '未知',
                        lastMsg: last.content,
                        lastTime: last.time,
                        unread: unread
                    });
                }
                conversations.sort((a, b) => new Date(b.lastTime) - new Date(a.lastTime));
                return conversations;
            }

            function renderConversations() {
                const list = document.getElementById('conversationList');
                const empty = document.getElementById('emptyMessage');
                const convs = buildConversations();
                if (convs.length === 0) {
                    list.innerHTML = '';
                    empty.classList.remove('hidden');
                    return;
                }
                empty.classList.add('hidden');
                let html = '';
                convs.forEach(c => {
                    const unreadBadge = c.unread > 0 ? `<span class="unread-badge">${c.unread}</span>` : '';
                    html += `
                        <div class="conversation-item" data-productid="${c.productId}" data-partnerid="${c.partnerId}">
                            <div class="d-flex justify-content-between">
                                <span class="product-title">${c.productTitle}</span>
                                <span class="time">${c.lastTime}</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="last-msg">${c.partnerNickname}: ${c.lastMsg}</span>
                                ${unreadBadge}
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html;
                document.querySelectorAll('.conversation-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const pid = this.dataset.productid;
                        const partner = this.dataset.partnerid;
                        window.location.href = `chat.html?productId=${pid}&sellerId=${partner}`;
                    });
                });
            }

            document.getElementById('backBtn').addEventListener('click', function() {
                window.location.replace('./main.html');
            });
            document.getElementById('logoutNavBtn').addEventListener('click', function() {
                localStorage.removeItem(SESSION_KEY);
                window.location.replace('./login.html');
            });

            renderConversations();
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) renderConversations();
            });

        })();
    </script>
</body>
</html>

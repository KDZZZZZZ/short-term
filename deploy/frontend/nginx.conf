# short-term web 前端:静态托管 + API 反向代理。
# 容器内监听 80,由 systemd 用户服务发布为宿主机 18084。
# 上游是同一台宿主机上 rootless Podman 网络里的 Gateway(公网 API 18083)。

upstream short_term_gateway {
    # podman 注入 host.containers.internal,配置加载时经 /etc/hosts 解析
    server host.containers.internal:18083;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 上传经此代理到网关;上限放宽,让网关自己的 413(PAYLOAD_TOO_LARGE)先生效
    client_max_body_size 25m;

    location /api/v1/ {
        proxy_pass http://short_term_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 用户上传的商品图片,由 Gateway 的只读媒体卷提供
    location /media/ {
        proxy_pass http://short_term_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Vite 构建产物文件名带内容哈希:可永久缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不缓存,保证发版后浏览器立刻拿到新资源清单
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 路由(chats/:id、products/:id 等)回退到入口
    location / {
        try_files $uri $uri/ /index.html;
    }
}

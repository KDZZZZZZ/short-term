<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园易淘 · 编辑商品</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .card { max-width: 560px; margin: 2.5rem auto; border-radius: 1rem; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.08); border: none; }
        .card-header { background-color: white; border-bottom: 1px solid #eee; font-weight: 600; font-size: 1.2rem; }
        .preview-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .preview-img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
        #message { min-height: 2.8rem; }
        .img-remove-btn { cursor: pointer; color: #dc3545; margin-left: 5px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fas fa-store-alt"></i> 校园易淘</a>
            <span class="text-muted">编辑商品</span>
        </div>
    </nav>

    <div class="container">
        <div class="card p-4">
            <div class="card-header bg-white">✏️ 编辑商品信息</div>
            <div class="card-body">
                <form id="editForm">
                    <div class="mb-3">
                        <label for="productName" class="form-label">商品名称 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="productName" required maxlength="100">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">商品类别 <span class="text-danger">*</span></label>
                        <select class="form-select" id="productCategory" required>
                            <option value="数码">数码</option>
                            <option value="书本">书本</option>
                            <option value="生活用品">生活用品</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="productPrice" class="form-label">价格（元） <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="productPrice" step="0.01" min="0" required placeholder="0.00">
                    </div>
                    <div class="mb-3">
                        <label for="productDescription" class="form-label">商品描述（可选）</label>
                        <textarea class="form-control" id="productDescription" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">商品状态</label>
                        <select class="form-select" id="productStatus">
                            <option value="selling">出售中</option>
                            <option value="sold">已售出</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">商品图片（至少1张，最多3张）</label>
                        <div id="currentImages" class="preview-container"></div>
                        <input type="file" class="form-control mt-2" id="productImages" accept="image/*" multiple>
                        <small class="text-muted">重新选择图片会替换现有图片，若不选择则保留原图</small>
                    </div>
                    <div id="message" class="mb-3"></div>
                    <div class="d-flex justify-content-between">
                        <button type="button" class="btn btn-secondary" id="cancelBtn">取消</button>
                        <button type="submit" class="btn btn-primary">💾 保存修改</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            'use strict';

            const API_BASE = '/api/v1';

            function getToken() { return localStorage.getItem('token'); }
            function getCurrentUser() {
                const u = localStorage.getItem('user');
                return u ? JSON.parse(u) : null;
            }
            function redirectToLogin() {
                window.location.replace('./login.html');
            }
            async function authFetch(url, options = {}) {
                const token = getToken();
                if (!token) { redirectToLogin(); return; }
                const headers = {
                    'Authorization': `Bearer ${token}`,
                    ...options.headers
                };
                if (options.body && options.body instanceof FormData) {
                    delete headers['Content-Type'];
                } else {
                    headers['Content-Type'] = 'application/json';
                }
                const resp = await fetch(url, { ...options, headers });
                if (resp.status === 401) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    redirectToLogin();
                    return;
                }
                return resp;
            }

            const user = getCurrentUser();
            if (!user || !getToken()) {
                redirectToLogin();
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get('id'));
            if (!productId) {
                alert('商品ID无效');
                window.location.replace('./myproducts.html');
                return;
            }

            const productName = document.getElementById('productName');
            const productCategory = document.getElementById('productCategory');
            const productPrice = document.getElementById('productPrice');
            const productDescription = document.getElementById('productDescription');
            const productStatus = document.getElementById('productStatus');
            const productImages = document.getElementById('productImages');
            const currentImagesContainer = document.getElementById('currentImages');
            const messageDiv = document.getElementById('message');
            const cancelBtn = document.getElementById('cancelBtn');
            const editForm = document.getElementById('editForm');

            let existingImages = [];
            let newFiles = [];

            async function loadProduct() {
                const resp = await authFetch(`${API_BASE}/products/${productId}`);
                if (!resp) return;
                const data = await resp.json();
                if (!resp.ok) {
                    alert(data.message || '商品不存在');
                    window.location.replace('./myproducts.html');
                    return;
                }
                const product = data.data;
                if (product.sellerStudentNumber !== user.studentNumber) {
                    alert('您无权编辑此商品');
                    window.location.replace('./myproducts.html');
                    return;
                }
                productName.value = product.title;
                productCategory.value = product.category || '其他';
                productPrice.value = product.price;
                productDescription.value = product.description || '';
                productStatus.value = product.status || 'selling';
                existingImages = product.images || [];
                renderImages();
            }

            function renderImages() {
                currentImagesContainer.innerHTML = '';
                if (existingImages.length === 0 && newFiles.length === 0) {
                    currentImagesContainer.innerHTML = '<span class="text-muted">暂无图片</span>';
                    return;
                }
                existingImages.forEach(img => {
                    const div = document.createElement('div');
                    div.className = 'position-relative';
                    const src = img.url || img;
                    div.innerHTML = `
                        <img src="${src}" class="preview-img" alt="商品图片">
                        <span class="img-remove-btn" data-id="${img.id || ''}" data-url="${src}">✕</span>
                    `;
                    currentImagesContainer.appendChild(div);
                });
                document.querySelectorAll('.img-remove-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        if (id) {
                            deleteImage(id);
                        }
                    });
                });
            }

            async function deleteImage(imageId) {
                if (!confirm('确定要删除这张图片吗？')) return;
                const resp = await authFetch(`${API_BASE}/products/${productId}/images/${imageId}`, {
                    method: 'DELETE'
                });
                if (!resp) return;
                if (resp.ok) {
                    existingImages = existingImages.filter(img => img.id !== imageId);
                    renderImages();
                    showMessage('图片已删除', false);
                } else {
                    const data = await resp.json();
                    showMessage(data.message || '删除失败');
                }
            }

            productImages.addEventListener('change', function(e) {
                const files = Array.from(e.target.files);
                if (files.length === 0) { newFiles = []; return; }
                if (files.length > 3) {
                    showMessage('最多只能选择3张图片');
                    productImages.value = '';
                    newFiles = [];
                    return;
                }
                for (let f of files) {
                    if (!f.type.startsWith('image/')) {
                        showMessage('请选择图片文件');
                        productImages.value = '';
                        newFiles = [];
                        return;
                    }
                }
                newFiles = files;
                // 预览新图
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const div = document.createElement('div');
                        div.innerHTML = `<img src="${ev.target.result}" class="preview-img" alt="新图片">`;
                        currentImagesContainer.appendChild(div);
                    };
                    reader.readAsDataURL(file);
                });
                clearMessage();
            });

            function showMessage(text, isError = true) {
                messageDiv.innerHTML = `<div class="alert ${isError ? 'alert-danger' : 'alert-success'} alert-dismissible fade show" role="alert">
                    ${text}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>`;
            }
            function clearMessage() { messageDiv.innerHTML = ''; }

            editForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                clearMessage();

                const name = productName.value.trim();
                const category = productCategory.value;
                const price = parseFloat(productPrice.value);
                const description = productDescription.value.trim() || '';
                const status = productStatus.value;

                if (!name) { showMessage('请输入商品名称'); return; }
                if (isNaN(price) || price < 0) { showMessage('请输入有效价格'); return; }

                const payload = { title: name, category, price, description, status };
                const resp = await authFetch(`${API_BASE}/products/${productId}`, {
                    method: 'PATCH',
                    body: JSON.stringify(payload)
                });
                if (!resp) return;
                const data = await resp.json();
                if (!resp.ok) {
                    showMessage(data.message || '更新失败');
                    return;
                }

                if (newFiles.length > 0) {
                    for (let file of newFiles) {
                        const formData = new FormData();
                        formData.append('image', file);
                        const uploadResp = await authFetch(`${API_BASE}/products/${productId}/images`, {
                            method: 'POST',
                            body: formData
                        });
                        if (!uploadResp || !uploadResp.ok) {
                            showMessage('部分图片上传失败', false);
                            break;
                        }
                    }
                }

                showMessage('✅ 商品已更新！', false);
                setTimeout(() => window.location.replace('./myproducts.html'), 1500);
            });

            cancelBtn.addEventListener('click', () => window.location.replace('./myproducts.html'));

            loadProduct();

        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园易淘 · 登录/注册</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { max-width: 480px; margin: 2rem auto; border-radius: 1rem; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1); }
        .form-switch-link { cursor: pointer; color: #0d6efd; text-decoration: underline; }
        .form-switch-link:hover { color: #0a58ca; }
        #message { min-height: 2.5rem; }
        .hidden { display: none !important; }
        .navbar-brand { font-weight: 600; }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">🏫 校园易淘</a>
        </div>
    </nav>
    <div class="container">
        <div id="app">
            <!-- 登录 -->
            <div id="loginForm">
                <div class="card p-4">
                    <h3 class="mb-3 text-center">🔑 登录</h3>
                    <form id="loginFormElement">
                        <div class="mb-3">
                            <label for="loginStudentNumber" class="form-label">学号（6位数字）</label>
                            <input type="text" class="form-control" id="loginStudentNumber" placeholder="请输入学号" required pattern="[0-9]{6}" maxlength="6">
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">密码</label>
                            <input type="password" class="form-control" id="loginPassword" placeholder="请输入密码" required minlength="8">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">登录</button>
                        <div class="mt-3 text-center">
                            <span class="form-switch-link" id="showRegisterBtn">还没有账号？去注册 →</span>
                        </div>
                    </form>
                    <div id="message" class="mt-3"></div>
                </div>
            </div>
            <!-- 注册 -->
            <div id="registerForm" class="hidden">
                <div class="card p-4">
                    <h3 class="mb-3 text-center">📝 注册</h3>
                    <form id="registerFormElement">
                        <div class="mb-3">
                            <label for="registerStudentNumber" class="form-label">学号（6位数字）</label>
                            <input type="text" class="form-control" id="registerStudentNumber" placeholder="请输入6位学号" required pattern="[0-9]{6}" maxlength="6">
                        </div>
                        <div class="mb-3">
                            <label for="registerPassword" class="form-label">密码（至少8位）</label>
                            <input type="password" class="form-control" id="registerPassword" placeholder="请设置密码" required minlength="8">
                        </div>
                        <div class="mb-3">
                            <label for="registerPhone" class="form-label">手机号 <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control" id="registerPhone" placeholder="请输入11位手机号" required pattern="[0-9]{11}" maxlength="11">
                        </div>
                        <div class="mb-3">
                            <label for="registerNickname" class="form-label">昵称</label>
                            <input type="text" class="form-control" id="registerNickname" placeholder="请输入您的昵称" required maxlength="50">
                        </div>
                        <div class="mb-3">
                            <label for="registerWechat" class="form-label">微信号（可选）</label>
                            <input type="text" class="form-control" id="registerWechat" placeholder="选填" maxlength="64">
                        </div>
                        <div class="mb-3">
                            <label for="registerQQ" class="form-label">QQ号（可选）</label>
                            <input type="text" class="form-control" id="registerQQ" placeholder="选填，5-20位数字" pattern="[0-9]{5,20}">
                        </div>
                        <button type="submit" class="btn btn-success w-100">注册</button>
                        <div class="mt-3 text-center">
                            <span class="form-switch-link" id="showLoginBtn">已有账号？去登录 →</span>
                        </div>
                    </form>
                    <div id="message2" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            'use strict';

            const USERS_KEY = 'mock_users';
            const SESSION_KEY = 'mock_session';

            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const showRegisterBtn = document.getElementById('showRegisterBtn');
            const showLoginBtn = document.getElementById('showLoginBtn');
            const messageDiv = document.getElementById('message');
            const messageDiv2 = document.getElementById('message2');
            const loginFormElement = document.getElementById('loginFormElement');
            const registerFormElement = document.getElementById('registerFormElement');

            function showMessage(el, text, isError = true) {
                el.innerHTML = `<div class="alert ${isError ? 'alert-danger' : 'alert-success'} alert-dismissible fade show" role="alert">
                    ${text}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>`;
            }
            function clearMessage(el) { el.innerHTML = ''; }

            function showLoginForm() {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                clearMessage(messageDiv);
                clearMessage(messageDiv2);
            }
            function showRegisterForm() {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                clearMessage(messageDiv);
                clearMessage(messageDiv2);
            }

            function getUsers() {
                const data = localStorage.getItem(USERS_KEY);
                return data ? JSON.parse(data) : {};
            }
            function saveUsers(users) { localStorage.setItem(USERS_KEY, JSON.stringify(users)); }
            function getSession() { return localStorage.getItem(SESSION_KEY) || null; }
            function setSession(sn) { localStorage.setItem(SESSION_KEY, sn); }
            function clearSession() { localStorage.removeItem(SESSION_KEY); }

            function checkAndRedirect() {
                const sn = getSession();
                if (sn) {
                    const users = getUsers();
                    if (users[sn]) {
                        console.log('已登录，跳转到主界面');
                        window.location.replace('./main.html');
                        return true;
                    } else {
                        clearSession();
                    }
                }
                return false;
            }

            loginFormElement.addEventListener('submit', function(e) {
                e.preventDefault();
                clearMessage(messageDiv);

                const studentNumber = document.getElementById('loginStudentNumber').value.trim();
                const password = document.getElementById('loginPassword').value;
                if (!studentNumber || !password) {
                    showMessage(messageDiv, '请完整填写学号和密码');
                    return;
                }
                const users = getUsers();
                const user = users[studentNumber];
                if (!user) {
                    showMessage(messageDiv, '该学号未注册，请先注册');
                    return;
                }
                if (user.password !== password) {
                    showMessage(messageDiv, '密码错误');
                    return;
                }
                setSession(studentNumber);
                console.log('登录成功，跳转到 main.html');
                window.location.replace('./main.html');
            });

            registerFormElement.addEventListener('submit', function(e) {
                e.preventDefault();
                clearMessage(messageDiv2);

                const studentNumber = document.getElementById('registerStudentNumber').value.trim();
                const password = document.getElementById('registerPassword').value;
                const phone = document.getElementById('registerPhone').value.trim();
                const nickname = document.getElementById('registerNickname').value.trim();
                const wechat = document.getElementById('registerWechat').value.trim() || null;
                const qq = document.getElementById('registerQQ').value.trim() || null;

                if (!studentNumber || !password || !phone || !nickname) {
                    showMessage(messageDiv2, '请填写所有必填项');
                    return;
                }
                if (!/^\d{6}$/.test(studentNumber)) {
                    showMessage(messageDiv2, '学号必须为6位数字');
                    return;
                }
                if (password.length < 8) {
                    showMessage(messageDiv2, '密码至少8位');
                    return;
                }
                if (!/^\d{11}$/.test(phone)) {
                    showMessage(messageDiv2, '手机号必须为11位数字');
                    return;
                }
                if (qq && !/^\d{5,20}$/.test(qq)) {
                    showMessage(messageDiv2, 'QQ号必须为5-20位数字');
                    return;
                }

                const users = getUsers();
                if (users[studentNumber]) {
                    showMessage(messageDiv2, '该学号已被注册，请直接登录');
                    return;
                }
                users[studentNumber] = { studentNumber, password, phone, nickname, wechat, qq };
                saveUsers(users);

                showMessage(messageDiv2, '注册成功！请前往登录。', false);
                registerFormElement.reset();
                showLoginForm();
                document.getElementById('loginStudentNumber').value = studentNumber;
            });

            showRegisterBtn.addEventListener('click', showRegisterForm);
            showLoginBtn.addEventListener('click', showLoginForm);

            if (!checkAndRedirect()) {
                showLoginForm();
            }

        })();
    </script>
</body>
</html>

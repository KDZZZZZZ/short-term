<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园易淘 · 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background-color: #f0f4f8;
            overflow: hidden;
        }

        /* ===== 左右两栏容器（全屏） ===== */
        .login-wrapper {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: white;
        }

        /* ===== 左侧：校园图片区（使用你选择的图片） ===== */
        .login-left {
            flex: 0 0 50%;
            height: 100vh;
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
            background-image: url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?w=1200&h=900&fit=crop');
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-left .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        .login-left .slogan {
            position: relative;
            z-index: 2;
            color: white;
            text-align: center;
            padding: 2rem;
        }

        .login-left .slogan h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .login-left .slogan p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-top: 0.5rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* ===== 左上角 Logo（固定） ===== */
        .brand-logo {
            position: absolute;
            top: 28px;
            left: 36px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.3rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: background 0.3s;
        }

        .brand-logo:hover {
            background: rgba(255, 255, 255, 0.25);
            color: white;
        }

        .brand-logo i {
            font-size: 1.6rem;
        }

        /* ===== 右侧：登录表单区（淡蓝背景，和左侧图片更协调） ===== */
        .login-right {
            flex: 0 0 50%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef3fb;
            padding: 2rem;
        }

        /* ===== 登录卡片（纯白色，浮在淡蓝背景上） ===== */
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.2rem 2rem 1.8rem;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        .login-card .card-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 0.25rem;
        }

        .login-card .card-subtitle {
            color: #6c757d;
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
        }

        .login-card .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-size: 0.95rem;
        }

        .login-card .form-control:focus {
            border-color: #4A90D9;
            box-shadow: 0 0 0 4px rgba(74, 144, 217, 0.12);
        }

        .login-card .btn-primary {
            border-radius: 40px;
            padding: 12px;
            font-weight: 600;
            font-size: 1rem;
            background: #4A90D9;
            border: none;
            transition: background 0.25s, transform 0.15s;
        }

        .login-card .btn-primary:hover {
            background: #3a7bc8;
            transform: translateY(-1px);
        }

        .login-card .btn-primary:active {
            transform: scale(0.98);
        }

        .login-card .btn-success {
            border-radius: 40px;
            padding: 12px;
            font-weight: 600;
            font-size: 1rem;
            background: #38a169;
            border: none;
            transition: background 0.25s, transform 0.15s;
        }

        .login-card .btn-success:hover {
            background: #2f855a;
            transform: translateY(-1px);
        }

        .login-card .form-switch-link {
            color: #4A90D9;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.2s;
        }

        .login-card .form-switch-link:hover {
            color: #2c6aa0;
            text-decoration: underline;
        }

        .login-card .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #a0aec0;
            font-size: 0.85rem;
            margin: 0.5rem 0 1rem;
        }

        .login-card .divider::before,
        .login-card .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        /* ===== 消息提示 ===== */
        #message,
        #message2 {
            min-height: 2.8rem;
        }

        .hidden {
            display: none !important;
        }

        /* ===== 响应式：小屏幕下左侧隐藏，右侧全屏 ===== */
        @media (max-width: 768px) {
            .login-left {
                display: none;
            }
            .login-right {
                flex: 0 0 100%;
                padding: 1.5rem;
            }
            .login-card {
                max-width: 100%;
                padding: 1.5rem 1.2rem;
            }
            .brand-logo {
                top: 16px;
                left: 20px;
                font-size: 1rem;
                padding: 6px 14px;
            }
            .login-card .card-title {
                font-size: 1.6rem;
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 1.2rem 1rem;
                border-radius: 16px;
            }
            .login-card .form-control {
                padding: 10px 14px;
                font-size: 0.9rem;
            }
            .login-card .btn-primary,
            .login-card .btn-success {
                font-size: 0.95rem;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 左上角品牌 Logo ===== -->
    <a href="#" class="brand-logo">
        <i class="fas fa-store-alt"></i>
        <span>校园易淘</span>
    </a>

    <!-- ===== 左右两栏容器 ===== -->
    <div class="login-wrapper">

        <!-- 左侧：校园图片 + 宣传语 -->
        <div class="login-left">
            <div class="overlay"></div>
            <div class="slogan">
                <h1>🎓 校园二手</h1>
                <p>让闲置流动起来 · 让青春更环保</p>
            </div>
        </div>

        <!-- 右侧：登录/注册表单 -->
        <div class="login-right">
            <div class="login-card">

                <!-- ====== 登录表单 ====== -->
                <div id="loginForm">
                    <h2 class="card-title">👋 欢迎回来</h2>
                    <p class="card-subtitle">登录你的校园易淘账号</p>
                    <form id="loginFormElement">
                        <div class="mb-3">
                            <label for="loginStudentNumber" class="form-label fw-semibold">学号</label>
                            <input type="text" class="form-control" id="loginStudentNumber"
                            placeholder="请输入6位学号" required pattern="[0-9]{6}" maxlength="6">
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label fw-semibold">密码</label>
                            <input type="password" class="form-control" id="loginPassword"
                            placeholder="请输入密码" required minlength="8">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">登 录</button>
                        <div class="divider">还没有账号？</div>
                        <div class="text-center">
                            <span class="form-switch-link" id="showRegisterBtn">立即注册 →</span>
                        </div>
                    </form>
                    <div id="message" class="mt-3"></div>
                </div>

                <!-- ====== 注册表单 ====== -->
                <div id="registerForm" class="hidden">
                    <h2 class="card-title">📝 注册新账号</h2>
                    <p class="card-subtitle">加入校园易淘，开始你的二手之旅</p>
                    <form id="registerFormElement">
                        <div class="mb-2">
                            <label for="registerStudentNumber" class="form-label fw-semibold">学号 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="registerStudentNumber"
                            placeholder="6位学号" required pattern="[0-9]{6}" maxlength="6">
                        </div>
                        <div class="mb-2">
                            <label for="registerPassword" class="form-label fw-semibold">密码 <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="registerPassword"
                            placeholder="至少8位" required minlength="8">
                        </div>
                        <div class="mb-2">
                            <label for="registerPhone" class="form-label fw-semibold">手机号 <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control" id="registerPhone"
                            placeholder="11位手机号" required pattern="[0-9]{11}" maxlength="11">
                        </div>
                        <div class="mb-2">
                            <label for="registerNickname" class="form-label fw-semibold">昵称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="registerNickname"
                            placeholder="你的昵称" required maxlength="50">
                        </div>
                        <div class="row g-2">
                            <div class="col-6">
                                <label for="registerWechat" class="form-label fw-semibold">微信号</label>
                                <input type="text" class="form-control" id="registerWechat" placeholder="选填" maxlength="64">
                            </div>
                            <div class="col-6">
                                <label for="registerQQ" class="form-label fw-semibold">QQ号</label>
                                <input type="text" class="form-control" id="registerQQ" placeholder="选填" pattern="[0-9]{5,20}">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 mt-3">注 册</button>
                        <div class="divider">已有账号？</div>
                        <div class="text-center">
                            <span class="form-switch-link" id="showLoginBtn">去登录 →</span>
                        </div>
                    </form>
                    <div id="message2" class="mt-3"></div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js">
    </script>
    <script>
        (function() {
            'use strict';

            const USERS_KEY = 'mock_users';
            const SESSION_KEY = 'mock_session';

            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const showRegisterBtn = document.getElementById('showRegisterBtn');
            const showLoginBtn = document.getElementById('showLoginBtn');
            const messageDiv = document.getElementById('message');
            const messageDiv2 = document.getElementById('message2');
            const loginFormElement = document.getElementById('loginFormElement');
            const registerFormElement = document.getElementById('registerFormElement');

            function showMessage(el, text, isError = true) {
                el.innerHTML =
                `<div class="alert ${isError ? 'alert-danger' : 'alert-success'} alert-dismissible fade show" role="alert">
                    ${text}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>`;
            }

            function clearMessage(el) { el.innerHTML = ''; }

            function showLoginForm() {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                clearMessage(messageDiv);
                clearMessage(messageDiv2);
            }

            function showRegisterForm() {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                clearMessage(messageDiv);
                clearMessage(messageDiv2);
            }

            function getUsers() {
                const data = localStorage.getItem(USERS_KEY);
                return data ? JSON.parse(data) : {};
            }

            function saveUsers(users) { localStorage.setItem(USERS_KEY, JSON.stringify(users)); }

            function getSession() { return localStorage.getItem(SESSION_KEY) || null; }

            function setSession(sn) { localStorage.setItem(SESSION_KEY, sn); }

            function clearSession() { localStorage.removeItem(SESSION_KEY); }

            function checkAndRedirect() {
                const sn = getSession();
                if (sn) {
                    const users = getUsers();
                    if (users[sn]) {
                        window.location.href = 'main.html';
                        return true;
                    } else {
                        clearSession();
                    }
                }
                return false;
            }

            loginFormElement.addEventListener('submit', function(e) {
                e.preventDefault();
                clearMessage(messageDiv);

                const studentNumber = document.getElementById('loginStudentNumber').value.trim();
                const password = document.getElementById('loginPassword').value;
                if (!studentNumber || !password) {
                    showMessage(messageDiv, '请完整填写学号和密码');
                    return;
                }
                const users = getUsers();
                const user = users[studentNumber];
                if (!user) {
                    showMessage(messageDiv, '该学号未注册，请先注册');
                    return;
                }
                if (user.password !== password) {
                    showMessage(messageDiv, '密码错误');
                    return;
                }
                setSession(studentNumber);
                window.location.href = 'main.html';
            });

            registerFormElement.addEventListener('submit', function(e) {
                e.preventDefault();
                clearMessage(messageDiv2);

                const studentNumber = document.getElementById('registerStudentNumber').value.trim();
                const password = document.getElementById('registerPassword').value;
                const phone = document.getElementById('registerPhone').value.trim();
                const nickname = document.getElementById('registerNickname').value.trim();
                const wechat = document.getElementById('registerWechat').value.trim() || null;
                const qq = document.getElementById('registerQQ').value.trim() || null;

                if (!studentNumber || !password || !phone || !nickname) {
                    showMessage(messageDiv2, '请填写所有必填项');
                    return;
                }
                if (!/^\d{6}$/.test(studentNumber)) {
                    showMessage(messageDiv2, '学号必须为6位数字');
                    return;
                }
                if (password.length < 8) {
                    showMessage(messageDiv2, '密码至少8位');
                    return;
                }
                if (!/^\d{11}$/.test(phone)) {
                    showMessage(messageDiv2, '手机号必须为11位数字');
                    return;
                }
                if (qq && !/^\d{5,20}$/.test(qq)) {
                    showMessage(messageDiv2, 'QQ号必须为5-20位数字');
                    return;
                }

                const users = getUsers();
                if (users[studentNumber]) {
                    showMessage(messageDiv2, '该学号已被注册，请直接登录');
                    return;
                }
                users[studentNumber] = { studentNumber, password, phone, nickname, wechat, qq };
                saveUsers(users);

                showMessage(messageDiv2, '✅ 注册成功！请登录', false);
                registerFormElement.reset();
                showLoginForm();
                document.getElementById('loginStudentNumber').value = studentNumber;
            });

            showRegisterBtn.addEventListener('click', showRegisterForm);
            showLoginBtn.addEventListener('click', showLoginForm);

            if (!checkAndRedirect()) {
                showLoginForm();
            }
        })();
    </script>
</body>
</html>

name: Deploy production

on:
  workflow_run:
    workflows:
      - Backend
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: production-short-term
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out the verified main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Build immutable backend image bundle
        env:
          BACKEND_GOPROXY: https://proxy.golang.org|https://goproxy.cn|direct
        run: |
          scripts/build-backend-images.sh "$RELEASE_SHA" "$RUNNER_TEMP/backend-images.tar.gz"
          {
            printf 'RELEASE_SHA=%s\n' "$RELEASE_SHA"
            printf 'ACCOUNT_IMAGE=localhost/short-term/account:%s\n' "$RELEASE_SHA"
            printf 'MARKETPLACE_IMAGE=localhost/short-term/marketplace:%s\n' "$RELEASE_SHA"
            printf 'MESSAGING_IMAGE=localhost/short-term/messaging:%s\n' "$RELEASE_SHA"
            printf 'FAVORITE_IMAGE=localhost/short-term/favorite:%s\n' "$RELEASE_SHA"
            printf 'GATEWAY_IMAGE=localhost/short-term/gateway:%s\n' "$RELEASE_SHA"
            printf 'POSTGRES_IMAGE=localhost/short-term/postgres:18-%s\n' "$RELEASE_SHA"
          } >"$RUNNER_TEMP/manifest.env"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify rootless host prerequisites
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          expected_openapi_service_sha="$(sha256sum deploy/short-term-openapi.service | cut -d' ' -f1)"
          expected_openapi_stage_sha="$(sha256sum deploy/stage-openapi.sh | cut -d' ' -f1)"
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "EXPECTED_OPENAPI_SERVICE_SHA='$expected_openapi_service_sha' EXPECTED_OPENAPI_STAGE_SHA='$expected_openapi_stage_sha' bash -s" <<'REMOTE'
          set -euo pipefail
          test "$(id -u)" -ne 0
          test -d /opt/short-term
          test ! -L /opt/short-term
          test -w /opt/short-term
          test "$(/usr/bin/podman info --format '{{.Host.Security.Rootless}}')" = true
          test "$(/usr/bin/loginctl show-user "$(id -u)" -p Linger --value)" = yes
          if ! /usr/bin/podman container exists short-term-gateway; then
            test -z "$(/usr/sbin/ss -H -ltn 'sport = :18083')"
          fi
          test "$(sha256sum /etc/systemd/system/short-term-openapi.service | cut -d' ' -f1)" = \
            "$EXPECTED_OPENAPI_SERVICE_SHA"
          test "$(sha256sum /usr/local/sbin/short-term-openapi-stage | cut -d' ' -f1)" = \
            "$EXPECTED_OPENAPI_STAGE_SHA"
          REMOTE

      - name: Upload release bundle
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh_base=(
            -i "$HOME/.ssh/deploy_key"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          release_dir="/opt/short-term/releases/$RELEASE_SHA"
          ssh "${ssh_base[@]}" "$remote" \
            "install -d -m 0750 '$release_dir' /opt/short-term/bin /opt/short-term/incoming /opt/short-term/releases && install -d -m 0700 /opt/short-term/runtime /opt/short-term/state"
          rsync -az --partial \
            -e "ssh -i $HOME/.ssh/deploy_key -p $DEPLOY_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            "$RUNNER_TEMP/backend-images.tar.gz" \
            "$RUNNER_TEMP/backend-images.tar.gz.sha256" \
            "$RUNNER_TEMP/manifest.env" \
            scripts/backend-e2e.py \
            "$remote:$release_dir/"
          rsync -az \
            -e "ssh -i $HOME/.ssh/deploy_key -p $DEPLOY_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            deploy/backend/short-term-backend.sh \
            deploy/backend/short-term-backend.service \
            "$remote:/opt/short-term/incoming/"
          rsync -az \
            -e "ssh -i $HOME/.ssh/deploy_key -p $DEPLOY_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            openapi/ \
            "$remote:/opt/short-term/incoming/"

      - name: Install release and verify local readiness
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          rollback_required=false
          rollback_on_exit() {
            exit_code=$?
            if [ "$exit_code" -ne 0 ] && [ "$rollback_required" = true ]; then
              /opt/short-term/bin/short-term-backend rollback || true
            fi
            exit "$exit_code"
          }
          trap rollback_on_exit EXIT
          install -d -m 0750 "$HOME/.config/systemd/user"
          install -m 0755 \
            /opt/short-term/incoming/short-term-backend.sh \
            /opt/short-term/bin/short-term-backend
          install -m 0644 \
            /opt/short-term/incoming/short-term-backend.service \
            "$HOME/.config/systemd/user/short-term-backend.service"
          /opt/short-term/bin/short-term-backend deploy "/opt/short-term/releases/$RELEASE_SHA"
          rollback_required=true
          sudo /usr/bin/systemctl restart short-term-openapi.service
          /usr/bin/systemctl --user is-active --quiet short-term-backend.service
          /usr/bin/systemctl is-active --quiet short-term-openapi.service
          /opt/short-term/bin/short-term-backend status
          /opt/short-term/bin/short-term-backend metrics
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:18082/ >/dev/null
          rollback_required=false
          REMOTE

      - name: Run production-host acceptance over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          rollback_required=true
          rollback_on_exit() {
            exit_code=$?
            if [ "$exit_code" -ne 0 ] && [ "$rollback_required" = true ]; then
              /opt/short-term/bin/short-term-backend rollback || true
            fi
            exit "$exit_code"
          }
          trap rollback_on_exit EXIT

          release_dir="/opt/short-term/releases/$RELEASE_SHA"
          result_file="$release_dir/production-e2e.json"
          test -f "$release_dir/backend-e2e.py"
          test ! -L "$release_dir/backend-e2e.py"
          curl --fail --silent --show-error --max-time 3 \
            http://127.0.0.1:18083/readyz >/dev/null
          python3 "$release_dir/backend-e2e.py" \
            --base-url http://127.0.0.1:18083 \
            --tag "$RELEASE_SHA" \
            --baseline-samples 20 \
            --result-file "$result_file"

          request_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["trace_request_id"])' "$result_file")"
          /opt/short-term/bin/short-term-backend verify-trace "$request_id"
          /opt/short-term/bin/short-term-backend verify-outbox
          /opt/short-term/bin/short-term-backend metrics
          rollback_required=false
          REMOTE

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园易淘 · 商品详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .container-detail { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .detail-card { border: none; border-radius: 1rem; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.08); background: white; overflow: hidden; }
        .detail-row { display: flex; flex-wrap: wrap; }
        .detail-image-col { flex: 1 1 50%; min-width: 300px; padding: 1rem; background: #fcfcfc; display: flex; align-items: center; justify-content: center; }
        .detail-info-col { flex: 1 1 50%; padding: 1.8rem; display: flex; flex-direction: column; justify-content: flex-start; }
        .carousel-inner img { height: 400px; width: 100%; object-fit: contain; background: #fcfcfc; border-radius: 0.5rem; }
        .carousel-control-prev-icon, .carousel-control-next-icon { background-color: rgba(0,0,0,0.3); border-radius: 50%; padding: 20px; }
        .detail-label { font-weight: 600; color: #495057; width: 80px; display: inline-block; }
        .detail-value { color: #212529; }
        .btn-chat { background-color: #0d6efd; color: white; border-radius: 50px; padding: 0.6rem 2rem; font-weight: 500; border: none; transition: background 0.2s; text-decoration: none; display: inline-block; text-align: center; }
        .btn-chat:hover { background-color: #0b5ed7; color: white; }
        .btn-edit { background-color: #ffc107; color: #212529; border-radius: 50px; padding: 0.6rem 2rem; font-weight: 500; border: none; transition: background 0.2s; text-decoration: none; display: inline-block; text-align: center; }
        .btn-edit:hover { background-color: #e0a800; color: #212529; }
        .back-btn { margin-bottom: 1rem; }
        @media (max-width: 768px) {
            .detail-image-col { flex: 1 1 100%; padding: 0.5rem; }
            .detail-info-col { flex: 1 1 100%; padding: 1rem; }
            .carousel-inner img { height: 280px; }
        }
        .status-badge { font-size: 0.8rem; padding: 0.2rem 0.8rem; border-radius: 20px; display: inline-block; }
        .status-selling { background-color: #d1e7dd; color: #0f5132; }
        .status-sold { background-color: #f8d7da; color: #842029; }
        .no-images { width: 100%; height: 400px; display: flex; align-items: center; justify-content: center; background: #e9ecef; color: #6c757d; font-size: 1.2rem; border-radius: 0.5rem; }
        .favorite-btn { background: none; border: none; font-size: 2rem; cursor: pointer; transition: transform 0.2s; padding: 0 0.5rem; }
        .favorite-btn:hover { transform: scale(1.1); }
        .favorite-btn .fa-heart { color: #ccc; }
        .favorite-btn .fa-heart.favorited { color: #e74c3c; }
        .detail-header { display: flex; justify-content: space-between; align-items: center; }
        .comment-section {
            margin-top: 2rem;
            border-top: 1px solid #e9ecef;
            padding-top: 1.5rem;
        }
        .comment-item { background: #f8f9fa; padding: 0.8rem 1rem; border-radius: 0.5rem; margin-bottom: 0.8rem; }
        .comment-meta { font-size: 0.85rem; color: #6c757d; margin-bottom: 0.2rem; }
        .comment-content { margin-bottom: 0.2rem; }
        .reply-item { background: #e9ecef; padding: 0.5rem 0.8rem; border-radius: 0.4rem; margin-top: 0.5rem; margin-left: 1.5rem; }
        .reply-meta { font-size: 0.8rem; color: #6c757d; }
        .reply-input-area { margin-top: 0.5rem; margin-left: 1.5rem; }
        .comment-input-area { margin-top: 1rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fas fa-store-alt"></i> 校园易淘</a>
            <span class="text-muted">商品详情</span>
        </div>
    </nav>

    <div class="container container-detail">
        <div class="back-btn">
            <button class="btn btn-outline-secondary" id="backBtn"><i class="fas fa-arrow-left"></i> 返回首页</button>
        </div>

        <div class="detail-card" id="detailCard">
            <!-- 由 JS 渲染 -->
        </div>

        <div class="comment-section" id="commentSection">
            <h5><i class="fas fa-comments"></i> 商品留言</h5>
            <div id="commentList"></div>
            <div class="comment-input-area">
                <div class="input-group">
                    <input type="text" class="form-control" id="commentInput" placeholder="发表你的留言...">
                    <button class="btn btn-primary" id="submitCommentBtn">发表</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            'use strict';

            const API_BASE = '/api/v1';

            function getToken() { return localStorage.getItem('token'); }
            function getCurrentUser() {
                const u = localStorage.getItem('user');
                return u ? JSON.parse(u) : null;
            }
            function redirectToLogin() {
                window.location.replace('./login.html');
            }
            async function authFetch(url, options = {}) {
                const token = getToken();
                if (!token) { redirectToLogin(); return; }
                const headers = {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                    ...options.headers
                };
                const resp = await fetch(url, { ...options, headers });
                if (resp.status === 401) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    redirectToLogin();
                    return;
                }
                return resp;
            }

            const user = getCurrentUser();
            if (!user || !getToken()) {
                redirectToLogin();
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get('id'));
            if (!productId) {
                alert('商品ID无效');
                window.location.replace('./main.html');
                return;
            }

            async function loadProduct() {
                const resp = await authFetch(`${API_BASE}/products/${productId}`);
                if (!resp) return;
                const data = await resp.json();
                if (!resp.ok) {
                    alert(data.message || '商品不存在');
                    window.location.replace('./main.html');
                    return;
                }
                const product = data.data;
                renderDetail(product);
                loadComments(product);
            }

            function renderDetail(product) {
                const container = document.getElementById('detailCard');
                const isSeller = (user.studentNumber === product.sellerStudentNumber);
                const statusText = product.status === 'selling' ? '出售中' : '已售出';
                const statusClass = product.status === 'selling' ? 'status-selling' : 'status-sold';

                let carouselHtml = '';
                const images = product.images || [];
                if (images.length === 0) {
                    carouselHtml = `<div class="carousel-item active"><div class="no-images">暂无图片</div></div>`;
                } else {
                    images.forEach((img, idx) => {
                        const active = idx === 0 ? 'active' : '';
                        const src = img.url || img;
                        carouselHtml += `
                            <div class="carousel-item ${active}">
                                <img src="${src}" class="d-block w-100" alt="商品图片" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22400%22 viewBox=%220 0 600 400%22%3E%3Crect width=%22600%22 height=%22400%22 fill=%22%23e9ecef%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 font-size=%2224%22 font-family=%22sans-serif%22 fill=%22%236c757d%22 text-anchor=%22middle%22 dy=%22.3em%22%3E图片加载失败%3C/text%3E%3C/svg%3E'">
                            </div>
                        `;
                    });
                }

                container.innerHTML = `
                    <div class="detail-row">
                        <div class="detail-image-col">
                            <div id="productCarousel" class="carousel slide w-100">
                                <div class="carousel-inner">${carouselHtml}</div>
                                ${images.length > 1 ? `
                                    <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel" data-bs-slide="prev">
                                        <span class="carousel-control-prev-icon"></span>
                                    </button>
                                    <button class="carousel-control-next" type="button" data-bs-target="#productCarousel" data-bs-slide="next">
                                        <span class="carousel-control-next-icon"></span>
                                    </button>
                                    <div class="carousel-indicators">
                                        ${images.map((_, i) => `<button type="button" data-bs-target="#productCarousel" data-bs-slide-to="${i}" class="${i===0?'active':''}"></button>`).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                        <div class="detail-info-col">
                            <div class="detail-header">
                                <h3 class="card-title mb-0">${product.title}</h3>
                                <button class="favorite-btn" id="favoriteBtn">
                                    <i class="fas fa-heart" id="favoriteIcon"></i>
                                </button>
                            </div>
                            <div class="mt-1 mb-2">
                                <span class="badge bg-light text-dark me-2">${product.category}</span>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                            <h4 class="text-danger">¥${product.price.toFixed(2)}</h4>
                            <hr>
                            <div class="mb-2"><span class="detail-label">描述：</span><span class="detail-value">${product.description || '暂无描述'}</span></div>
                            <div class="mb-2"><span class="detail-label">卖家手机：</span><span class="detail-value">${product.sellerPhone || '未留'}</span></div>
                            <div id="sellerContact" class="mb-2"></div>
                            <div class="mt-4 d-grid">
                                <a href="${isSeller ? `edit.html?id=${product.id}` : `chat.html?productId=${product.id}&sellerId=${product.sellerStudentNumber}`}" 
                                   class="btn ${isSeller ? 'btn-edit' : 'btn-chat'}">
                                    <i class="fas ${isSeller ? 'fa-edit' : 'fa-comment-dots'}"></i> 
                                    ${isSeller ? '修改商品' : '联系卖家'}
                                </a>
                            </div>
                        </div>
                    </div>
                `;

                // 获取收藏状态
                updateFavoriteUI(product.id);
                document.getElementById('favoriteBtn').addEventListener('click', () => toggleFavorite(product.id));
            }

            // ----- 收藏 -----
            async function toggleFavorite(productId) {
                // 先检查当前是否已收藏
                const resp_check = await authFetch(`${API_BASE}/favorites`);
                if (!resp_check) return;
                const data_check = await resp_check.json();
                const favs = data_check.data || [];
                const isFav = favs.some(f => f.id === productId || f.productId === productId || f === productId);

                if (isFav) {
                    const resp = await authFetch(`${API_BASE}/favorites/${productId}`, { method: 'DELETE' });
                    if (resp && resp.ok) {
                        alert('已取消收藏');
                        updateFavoriteUI(productId);
                    }
                } else {
                    const resp = await authFetch(`${API_BASE}/favorites/${productId}`, { method: 'PUT' });
                    if (resp && resp.ok) {
                        alert('已收藏 ❤️');
                        updateFavoriteUI(productId);
                    }
                }
            }

            async function updateFavoriteUI(productId) {
                const resp = await authFetch(`${API_BASE}/favorites`);
                if (!resp) return;
                const data = await resp.json();
                const favs = data.data || [];
                const isFav = favs.some(f => f.id === productId || f.productId === productId || f === productId);
                const icon = document.getElementById('favoriteIcon');
                if (icon) {
                    if (isFav) icon.classList.add('favorited');
                    else icon.classList.remove('favorited');
                }
            }

            // ----- 留言（保留本地存储） -----
            function loadComments(product) {
                // 留言功能保留 localStorage，不接入后端
                // 代码与之前一致，此处省略
                const commentList = document.getElementById('commentList');
                const commentInput = document.getElementById('commentInput');
                const submitCommentBtn = document.getElementById('submitCommentBtn');
                const COMMENTS_KEY = 'comments_' + product.id;

                function getComments() {
                    const data = localStorage.getItem(COMMENTS_KEY);
                    return data ? JSON.parse(data) : [];
                }
                function saveComments(comments) {
                    localStorage.setItem(COMMENTS_KEY, JSON.stringify(comments));
                }

                function renderComments() {
                    const comments = getComments();
                    if (comments.length === 0) {
                        commentList.innerHTML = '<p class="text-muted">暂无留言</p>';
                        return;
                    }
                    let html = '';
                    const isSeller = (user.studentNumber === product.sellerStudentNumber);
                    comments.forEach(c => {
                        html += `
                            <div class="comment-item" data-comment-id="${c.id}">
                                <div class="comment-meta"><strong>${c.buyerNickname}</strong> · ${c.time}</div>
                                <div class="comment-content">${c.content}</div>
                        `;
                        if (c.replies && c.replies.length > 0) {
                            c.replies.forEach(r => {
                                html += `
                                    <div class="reply-item">
                                        <div class="reply-meta"><strong>${r.sellerNickname}（卖家）</strong> · ${r.time}</div>
                                        <div>${r.content}</div>
                                    </div>
                                `;
                            });
                        }
                        if (isSeller) {
                            html += `
                                <div class="reply-input-area">
                                    <div class="input-group input-group-sm">
                                        <input type="text" class="form-control reply-input" placeholder="回复...">
                                        <button class="btn btn-outline-primary btn-sm reply-btn">回复</button>
                                    </div>
                                </div>
                            `;
                        }
                        html += `</div>`;
                    });
                    commentList.innerHTML = html;

                    document.querySelectorAll('.reply-btn').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const item = this.closest('.comment-item');
                            const id = parseInt(item.dataset.commentId);
                            const input = item.querySelector('.reply-input');
                            const text = input.value.trim();
                            if (!text) return;
                            const comments = getComments();
                            const comment = comments.find(c => c.id === id);
                            if (!comment) return;
                            if (!comment.replies) comment.replies = [];
                            comment.replies.push({
                                sellerStudentNumber: user.studentNumber,
                                sellerNickname: user.nickname,
                                content: text,
                                time: new Date().toLocaleString()
                            });
                            saveComments(comments);
                            renderComments();
                            input.value = '';
                        });
                    });
                }

                submitCommentBtn.addEventListener('click', function() {
                    const content = commentInput.value.trim();
                    if (!content) return;
                    const comments = getComments();
                    comments.push({
                        id: Date.now(),
                        buyerStudentNumber: user.studentNumber,
                        buyerNickname: user.nickname,
                        content: content,
                        time: new Date().toLocaleString(),
                        replies: []
                    });
                    saveComments(comments);
                    commentInput.value = '';
                    renderComments();
                });

                renderComments();
            }

            // ----- 返回 -----
            document.getElementById('backBtn').addEventListener('click', () => window.location.replace('./main.html'));

            loadProduct();

        })();
    </script>
</body>
</html>

syntax = "proto3";

package shortterm.marketplace.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/KDZZZZZZ/short-term/gen/go/shortterm/marketplace/v1;marketplacev1";

// MarketplaceService 负责商品、商品图片、交易以及商品/交易状态机。
// 必须保持原子性的商品和交易转换（接受、取消已接受交易、双方确认）
// 都在此处的单一本地事务中运行。
service MarketplaceService {
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc ListUserProducts(ListUserProductsRequest) returns (ListUserProductsResponse);
  rpc BatchGetProducts(BatchGetProductsRequest) returns (BatchGetProductsResponse);
  rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse);
  rpc AddProductImages(AddProductImagesRequest) returns (AddProductImagesResponse);
  rpc DeleteProductImage(DeleteProductImageRequest) returns (DeleteProductImageResponse);
  rpc OffShelfProduct(OffShelfProductRequest) returns (OffShelfProductResponse);
  rpc RelistProduct(RelistProductRequest) returns (RelistProductResponse);
  rpc CreateTrade(CreateTradeRequest) returns (CreateTradeResponse);
  rpc ListTrades(ListTradesRequest) returns (ListTradesResponse);
  rpc GetTrade(GetTradeRequest) returns (GetTradeResponse);
  rpc AcceptTrade(AcceptTradeRequest) returns (AcceptTradeResponse);
  rpc RejectTrade(RejectTradeRequest) returns (RejectTradeResponse);
  rpc CancelTrade(CancelTradeRequest) returns (CancelTradeResponse);
  rpc ConfirmTrade(ConfirmTradeRequest) returns (ConfirmTradeResponse);
  rpc CreateProductComment(CreateProductCommentRequest) returns (CreateProductCommentResponse);
  rpc ListProductComments(ListProductCommentsRequest) returns (ListProductCommentsResponse);
  rpc CreateTradeReview(CreateTradeReviewRequest) returns (CreateTradeReviewResponse);
  rpc BatchGetProductTradeReviews(BatchGetProductTradeReviewsRequest) returns (BatchGetProductTradeReviewsResponse);
}

enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  PRODUCT_STATUS_ON_SALE = 1;
  PRODUCT_STATUS_RESERVED = 2;
  PRODUCT_STATUS_SOLD = 3;
  PRODUCT_STATUS_OFF_SHELF = 4;
}

enum TradeStatus {
  TRADE_STATUS_UNSPECIFIED = 0;
  TRADE_STATUS_PENDING = 1;
  TRADE_STATUS_ACCEPTED = 2;
  TRADE_STATUS_COMPLETED = 3;
  TRADE_STATUS_CANCELLED = 4;
}

enum ProductCategory {
  PRODUCT_CATEGORY_UNSPECIFIED = 0;
  PRODUCT_CATEGORY_TEXTBOOK = 1;
  PRODUCT_CATEGORY_DIGITAL = 2;
  PRODUCT_CATEGORY_LIFE = 3;
  PRODUCT_CATEGORY_OTHER = 4;
}

message ImageUpload {
  bytes data = 1;
  string content_type = 2;
}

message ProductImage {
  string id = 1;
  string url = 2;
  int32 sort_order = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ProductSummary {
  string id = 1;
  string title = 2;
  int64 price_minor = 3;
  ProductCategory category = 4;
  optional string cover_url = 5;
  ProductStatus status = 6;
  string seller_id = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ProductDetail {
  string id = 1;
  string title = 2;
  int64 price_minor = 3;
  ProductCategory category = 4;
  string description = 5;
  ProductStatus status = 6;
  repeated ProductImage images = 7;
  string seller_id = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message ProductPage {
  repeated ProductSummary items = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 total = 4;
}

message TradeProduct {
  string id = 1;
  string title = 2;
  optional string cover_url = 3;
  ProductStatus status = 4;
}

message Trade {
  string id = 1;
  TradeProduct product = 2;
  string buyer_id = 3;
  string seller_id = 4;
  optional string conversation_id = 5;
  int64 price_snapshot_minor = 6;
  TradeStatus status = 7;
  bool buyer_confirmed = 8;
  bool seller_confirmed = 9;
  optional string cancel_reason = 10;
  google.protobuf.Timestamp created_at = 11;
  optional google.protobuf.Timestamp accepted_at = 12;
  optional google.protobuf.Timestamp completed_at = 13;
  optional google.protobuf.Timestamp cancelled_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message TradePage {
  repeated Trade items = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 total = 4;
}

message CreateProductRequest {
  string actor_id = 1;
  string title = 2;
  int64 price_minor = 3;
  ProductCategory category = 4;
  string description = 5;
  repeated ImageUpload images = 6;
}

message CreateProductResponse {
  ProductDetail product = 1;
}

message GetProductRequest {
  string product_id = 1;
}

message GetProductResponse {
  ProductDetail product = 1;
}

message ListProductsRequest {
  optional string keyword = 1;
  optional ProductCategory category = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListUserProductsRequest {
  string seller_id = 1;
  optional ProductStatus status = 2;
  int32 page = 3;
  int32 page_size = 4;
  // statuses 是状态集合过滤，供公开的卖家商品列表使用；为空时不过滤。
  repeated ProductStatus statuses = 5;
}

message ListProductsResponse {
  ProductPage page = 1;
}

message ListUserProductsResponse {
  ProductPage page = 1;
}

message BatchGetProductsRequest {
  repeated string product_ids = 1;
}

message BatchGetProductsResponse {
  map<string, ProductSummary> products = 1;
}

message UpdateProductRequest {
  string actor_id = 1;
  string product_id = 2;
  optional string title = 3;
  optional int64 price_minor = 4;
  optional ProductCategory category = 5;
  optional string description = 6;
}

message UpdateProductResponse {
  ProductDetail product = 1;
}

message AddProductImagesRequest {
  string actor_id = 1;
  string product_id = 2;
  repeated ImageUpload images = 3;
}

message AddProductImagesResponse {
  repeated ProductImage images = 1;
}

message DeleteProductImageRequest {
  string actor_id = 1;
  string product_id = 2;
  string image_id = 3;
}

message DeleteProductImageResponse {}

message OffShelfProductRequest {
  string actor_id = 1;
  string product_id = 2;
}

message OffShelfProductResponse {
  ProductDetail product = 1;
}

message RelistProductRequest {
  string actor_id = 1;
  string product_id = 2;
}

message RelistProductResponse {
  ProductDetail product = 1;
}

message CreateTradeRequest {
  string actor_id = 1;
  string product_id = 2;
  optional string conversation_id = 3;
  optional string idempotency_key = 4;
  // conversation_id_present distinguishes an omitted JSON property from an
  // explicitly supplied null. The public create-or-get contract treats those
  // two forms differently when an intent already exists.
  bool conversation_id_present = 5;
}

message CreateTradeResponse {
  Trade trade = 1;
  bool replayed = 2;
  // created is true for the first successful creation and its idempotent
  // replays. It is false when create-or-get returned an existing intent.
  bool created = 3;
}

message ListTradesRequest {
  string actor_id = 1;
  bool as_buyer = 2;
  optional TradeStatus status = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListTradesResponse {
  TradePage page = 1;
}

message GetTradeRequest {
  string actor_id = 1;
  string trade_id = 2;
}

message GetTradeResponse {
  Trade trade = 1;
}

message AcceptTradeRequest {
  string actor_id = 1;
  string trade_id = 2;
  optional string idempotency_key = 3;
}

message AcceptTradeResponse {
  Trade trade = 1;
  bool replayed = 2;
}

message RejectTradeRequest {
  string actor_id = 1;
  string trade_id = 2;
  string reason = 3;
  optional string idempotency_key = 4;
}

message RejectTradeResponse {
  Trade trade = 1;
  bool replayed = 2;
}

message CancelTradeRequest {
  string actor_id = 1;
  string trade_id = 2;
  string reason = 3;
  optional string idempotency_key = 4;
}

message CancelTradeResponse {
  Trade trade = 1;
  bool replayed = 2;
}

message ConfirmTradeRequest {
  string actor_id = 1;
  string trade_id = 2;
  optional string idempotency_key = 3;
}

message ConfirmTradeResponse {
  Trade trade = 1;
  bool replayed = 2;
}

// ProductComment 是用户就商品发布的不可变文字评论。任何用户可以对任何
// 现存商品发布任意多条评论；公开契约只暴露 user_id，昵称由 Gateway 批量补全。
message ProductComment {
  string id = 1;
  string product_id = 2;
  string user_id = 3;
  string content = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ProductCommentPage {
  repeated ProductComment items = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 total = 4;
}

message CreateProductCommentRequest {
  string actor_id = 1;
  string product_id = 2;
  string content = 3;
}

message CreateProductCommentResponse {
  ProductComment comment = 1;
}

message ListProductCommentsRequest {
  string product_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListProductCommentsResponse {
  ProductCommentPage page = 1;
}

// TradeReview 是买家在交易完成后发布的不可变文字评价。每笔交易最多一条；
// 公开契约只暴露 buyer_id，昵称由 Gateway 批量补全。评价与商品用户评论
// （ProductComment）相互独立。
message TradeReview {
  string id = 1;
  string trade_id = 2;
  string product_id = 3;
  string buyer_id = 4;
  string content = 5;
  google.protobuf.Timestamp created_at = 6;
}

message CreateTradeReviewRequest {
  string actor_id = 1;
  string trade_id = 2;
  string content = 3;
}

message CreateTradeReviewResponse {
  TradeReview review = 1;
}

message BatchGetProductTradeReviewsRequest {
  repeated string product_ids = 1;
}

message BatchGetProductTradeReviewsResponse {
  map<string, TradeReview> reviews = 1;
}
